spring:
  application:
    name: api-prazo-certo

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseling-on-migrate: true

api:
  security:
    token:
      secret: ${JWT_SECRET:long-secret-key-api-prazo-certo}